[package]
name = "nice"
version = "0.0.2-test.1"
description = "N.I.C.E."
authors = ["you"]
edition = "2021"
default-run = "nice"

[lib]
name = "nice"
path = "src/lib.rs"

[[bin]]
name = "nice"
path = "src/main.rs"

[[bin]]
name = "nice-server"
path = "src/bin/nice-server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
ico = "0.5"

[package.metadata.tauri]
productName = "N.I.C.E."

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
blake3 = "1"
base64 = "0.22"
tauri-plugin-dialog = "2.6.0"
notify = "6.1.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
epub-builder = "0.4.8"
axum = { version = "0.8.9", features = ["ws", "http1"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
clap = { version = "4.6.7", features = ["derive"] }
tower = "0.5.3"
similar = "3.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
printpdf = "0.8.2"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
