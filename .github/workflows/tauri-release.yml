name: Build And Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact_name: bundle-windows
          - name: macos
            os: macos-latest
            artifact_name: bundle-macos
          - name: linux
            os: ubuntu-22.04
            artifact_name: bundle-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Install JavaScript dependencies (webui)
        run: pnpm --dir webui install --frozen-lockfile

      - name: Generate icon set
        shell: bash
        run: pnpm exec tauri icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build Tauri bundles
        run: pnpm run tauri:build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
            src-tauri/target/release/*.dmg
            src-tauri/target/release/*.AppImage
            src-tauri/target/release/*.deb
            src-tauri/target/release/*.rpm

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: bundle-*
          merge-multiple: true

      - name: Delete stale release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # softprops 只追加不清理：重跑会把旧 run 的残留产物永久留在 release 里。
          # 因此发布前把同名 release 连同其全部产物整对象删除，让本次发布全新落盘。
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            echo "发现旧 release（id=$RELEASE_ID），连产物一起删除..."
            gh api -X DELETE "repos/${{ github.repository }}/releases/$RELEASE_ID"
            echo "已删除"
          else
            echo "无同名 release，全新发布"
          fi
          # 历史失败遗留的同 tag 草稿（softprops 中断产物）顺带清掉，容忍单个失败
          DRAFT_IDS=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.draft == true and .tag_name == \"${{ github.ref_name }}\") | .id" 2>/dev/null || true)
          for rid in $DRAFT_IDS; do
            echo "清理同 tag 草稿 release（id=$rid）..."
            gh api -X DELETE "repos/${{ github.repository }}/releases/$rid" || true
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
